[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "donghua-stream"
version = "1.1.0"
description = "Donghua / YouTube video downloader with a TV-streaming-style PyQt6 desktop app and rich interactive CLI, backed by PostgreSQL."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Alaric-senpai" }]
keywords = ["youtube", "donghua", "downloader", "yt-dlp", "postgresql", "pyqt6"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Video :: Capture",
]
# Dependencies shared by both front-ends.  The front-end specific packages live
# in the optional extras below so the CLI can be installed without PyQt6 and
# the desktop app without the interactive prompt libraries.
dependencies = [
    "yt-dlp>=2024.1.0",
    "psycopg2-binary>=2.9",
    "cryptography>=42",
]

[project.optional-dependencies]
cli = [
    "rich>=13.0",
    "questionary>=2.0",
]
gui = [
    "PyQt6>=6.6",
]
dev = [
    "pyflakes>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
# Local development project; no remote yet.

[project.scripts]
donghua = "script:main"
donghua-gui = "gui_entry:main"
donghua-cli = "script:main"

[tool.setuptools]
# Flat module layout for the shared downloader/config/storage layer plus the
# CLI and GUI entry points.  `gui_entry` must be listed explicitly: editable
# installs only expose the modules declared here.
py-modules = [
    "script",
    "db",
    "downloader",
    "urls",
    "app_config",
    "youtube_api",
    "media_ids",
    "sources",
    "gui_entry",
]

[tool.setuptools.packages.find]
include = ["gui", "gui.*"]

[tool.setuptools.package-data]
gui = [
    "assets/icons/*.svg",
    "assets/icons/*.png",
]
